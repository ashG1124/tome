name: Claude review

on:
  pull_request:
    types: [review_requested]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.requested_reviewer.login == github.repository_owner &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    # 조건에 안 맞아 건너뛴 실행(다른 댓글, 리뷰 봇 댓글)이 진행 중인 리뷰를 취소하지 않게 job 단위로 둔다.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # issue_comment 트리거에서는 PR 브랜치가 아니라 기본 브랜치가 체크아웃된다.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}'
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --max-turns 30
