name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # CI 안에서만 쓰는 개발용 리터럴이며 비밀이 아니다.
          POSTGRES_USER: tome
          POSTGRES_PASSWORD: tome
          POSTGRES_DB: tome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tome -d tome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Forbidden paths
        run: node scripts/check-forbidden-paths.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @tome/shared build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate test DB
        run: pnpm --filter @tome/server prisma:migrate:deploy
        env:
          DIRECT_DATABASE_URL: postgresql://tome:tome@localhost:5432/tome?schema=public
          DATABASE_URL: postgresql://tome:tome@localhost:5432/tome?schema=public
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://tome:tome@localhost:5432/tome?schema=public
      - name: Build
        run: pnpm build
      - name: Format check
        run: pnpm format:check
