# Cloudflare Containers 배포 설정 (Issue #21). 실행 위치: apps/server
# 계정 ID·API 토큰·서비스 주소는 이 파일에 쓰지 않는다.
# 비밀값은 `npx wrangler secret put <이름>`으로 등록한다(값은 프롬프트에만 붙여 넣는다):
#   DATABASE_URL        pooled 연결 주소
#   DIRECT_DATABASE_URL 마이그레이션용 직접 연결 주소
#   CORS_ORIGIN         허용할 웹앱 출처(쉼표로 여러 개)

name = "tome-api"
main = "worker/index.ts"
# 설치된 wrangler(4.156.2)의 실행기가 지원하는 마지막 날짜보다 늦으면 로컬 실행이 실패한다.
compatibility_date = "2026-11-02"

[[containers]]
class_name = "TomeServer"
image = "./Dockerfile"
# Dockerfile 은 저장소 루트를 빌드 컨텍스트로 쓴다(Dockerfile 1행).
# 기본값은 Dockerfile 이 있는 폴더(apps/server)라서 루트로 바꾼다.
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "TOME_SERVER"
class_name = "TomeServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TomeServer"]
