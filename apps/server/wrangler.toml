# Cloudflare Containers 배포 설정 (Issue #21). 실행 위치: apps/server
# 계정 ID·API 토큰·서비스 주소는 이 파일에 쓰지 않는다.
# 비밀값은 `npx wrangler secret put <이름>`으로 등록한다(값은 프롬프트에만 붙여 넣는다):
#   DATABASE_URL        pooled 연결 주소
#   CORS_ORIGIN         허용할 웹앱 출처(쉼표로 여러 개)
#   ADMIN_TOKEN         관리 API(X-Admin-Token) 보호용. 값은 리드와만 공유
#   R2_ENDPOINT         R2 S3 API 주소(https://<계정ID>.r2.cloudflarestorage.com, 버킷 이름은 붙이지 않음)
#   R2_BUCKET           이미지 버킷 이름(공개 접근 끔)
#   R2_ACCESS_KEY_ID    그 버킷 하나에만 Object Read & Write 인 R2 API 토큰의 키 ID
#   R2_SECRET_ACCESS_KEY  같은 토큰의 비밀 키
# R2_* 넷은 배포 전에 먼저 등록한다(STORAGE_DRIVER=r2 라서 없으면 서버가 켜지지 않는다).
# 새 비밀값은 worker/index.ts 의 envVars 에도 추가해야 컨테이너에 전달된다.
# 배포 순서: (direct 주소로) prisma migrate deploy → wrangler deploy --var APP_VERSION:<커밋 해시>
# 자세한 방법은 PR #67 본문 "배포 방법".

name = "tome-api"
main = "worker/index.ts"
# 설치된 wrangler(4.156.2)의 실행기가 지원하는 마지막 날짜보다 늦으면 로컬 실행이 실패한다.
compatibility_date = "2026-11-02"
# workers.dev 주소 하나만 쓴다. 버전별 미리보기 주소는 쓰지 않는다.
workers_dev = true
preview_urls = false

[[containers]]
class_name = "TomeServer"
image = "./Dockerfile"
# Dockerfile 은 저장소 루트를 빌드 컨텍스트로 쓴다(Dockerfile 1행).
# 기본값은 Dockerfile 이 있는 폴더(apps/server)라서 루트로 바꾼다.
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "TOME_SERVER"
class_name = "TomeServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TomeServer"]
