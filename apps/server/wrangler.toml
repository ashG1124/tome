# 컨테이너 배포 설정 자리. 이름과 값은 배포 작업에서 채운다.
# 계정 ID·API 토큰·서비스 주소는 이 파일에 쓰지 않고 환경변수나 배포 도구의 비밀 저장소로 받는다.
#
# name = "<worker-name>"
# main = "<worker-entry>"
# compatibility_date = "<yyyy-mm-dd>"
#
# 컨테이너가 받는 환경변수(값은 비밀 저장소에서 주입):
#   DATABASE_URL        pooled 연결 주소
#   DIRECT_DATABASE_URL 마이그레이션용 직접 연결 주소(선택)
#   AI_PROVIDER         mock
#   CORS_ORIGIN         허용할 웹앱 출처
