# Cloudflare Containers 배포 설정 (Issue #21). 실행 위치: apps/server
# 계정 ID·API 토큰·서비스 주소는 이 파일에 쓰지 않는다.
# 비밀값은 `npx wrangler secret put <이름>`으로 등록한다(값은 프롬프트에만 붙여 넣는다):
#   DATABASE_URL        pooled 연결 주소
#   CORS_ORIGIN         허용할 웹앱 출처(쉼표로 여러 개)
#   ADMIN_TOKEN         관리 API(X-Admin-Token) 보호용. 값은 리드와만 공유
#   R2_ENDPOINT         R2 S3 API 주소(https://<계정ID>.r2.cloudflarestorage.com, 버킷 이름은 붙이지 않음)
#   R2_BUCKET           이미지 버킷 이름(공개 접근 끔)
#   R2_ACCESS_KEY_ID    그 버킷 하나에만 Object Read & Write 인 R2 API 토큰의 키 ID
#   R2_SECRET_ACCESS_KEY  같은 토큰의 비밀 키
#   WAKE_WINDOWS        운영 시간표(KST, JSON). 이 시간 안에만 cron 이 서버를 깨운다(#45, 형식은 worker/wake.ts).
#                       없거나 형식이 틀리면 깨우지 않는다. Worker 에서만 쓰고 컨테이너로는 넘기지 않는다.
#   AI_PROVIDER         실제 AI 스위치(#62). 'workers-ai' 면 켜고, 없거나 'mock' 이면 가짜 AI. 끌 때는 mock 으로 바꾼다.
#   WORKERS_AI_ACCOUNT_ID  Workers AI 를 부를 계정 ID(리드 계정)
#   WORKERS_AI_API_TOKEN   Workers AI 권한만 있는 API 토큰
#                       스위치가 켜졌는데 키가 하나라도 없으면 mock 으로 돌고 경고만 남긴다(worker/ai-env.ts).
# R2_* 넷은 배포 전에 먼저 등록한다(STORAGE_DRIVER=r2 라서 없으면 서버가 켜지지 않는다).
# 새 비밀값은 worker/index.ts 의 envVars 에도 추가해야 컨테이너에 전달된다.
# 배포: main 에 병합되면 .github/workflows/deploy.yml 이 자동으로 한다(#45).
# 손으로 할 때 순서: (direct 주소로) prisma migrate deploy
#   → apps/server/build-info/version.txt 에 커밋 해시(7자리)를 쓴다(printf '%s' <해시> > build-info/version.txt)
#   → wrangler deploy --var APP_VERSION:<커밋 해시>
# version.txt 가 이미지에 들어가야 서버 코드가 같아도 컨테이너가 새로 교체된다(#177).

name = "tome-api"
main = "worker/index.ts"
# 설치된 wrangler(4.156.2)의 실행기가 지원하는 마지막 날짜보다 늦으면 로컬 실행이 실패한다.
compatibility_date = "2026-11-02"
# workers.dev 주소 하나만 쓴다. 버전별 미리보기 주소는 쓰지 않는다.
workers_dev = true
preview_urls = false

# 5분마다 worker/index.ts 의 scheduled 가 돈다. 서버를 깨우는 건 WAKE_WINDOWS 시간 안일 때뿐이다(#45).
# 서버는 요청이 없으면 10분 뒤 잠드므로, 5분 간격이면 운영 시간 내내 깨어 있다.
[triggers]
crons = ["*/5 * * * *"]

# Workers Logs(#131). 배포 뒤에도 실제 AI 실행 로그(RunLog: 단계·모델·상태·시간·폴백)가 남게 켠다.
# 대시보드에서만 켜 두면 main 자동 배포 때 이 파일 기준으로 다시 꺼질 수 있어서 여기에 둔다.
# 로그에는 프롬프트 원문·토큰·IP 원문을 남기지 않는다(apps/server/AGENTS.md). traces(추적)는 쓰지 않는다.
# - 맨 위 enabled: 컨테이너(NestJS)의 로그는 이 스위치를 물려받는다. 이게 없으면 RunLog 가 Logs 에 안 남는다.
# - invocation_logs = false: 요청마다 남는 자동 기록에는 접속 IP·위치(도시·좌표)가 들어가서 끈다.
#   요청 수·오류율은 대시보드 메트릭에서 본다.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[[containers]]
class_name = "TomeServer"
image = "./Dockerfile"
# Dockerfile 은 저장소 루트를 빌드 컨텍스트로 쓴다(Dockerfile 1행).
# 기본값은 Dockerfile 이 있는 폴더(apps/server)라서 루트로 바꾼다.
image_build_context = "../.."
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "TOME_SERVER"
class_name = "TomeServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TomeServer"]
